name: Gym Management System CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
          POSTGRES_DB: gym_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gym_user -d gym_management"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://gym_user:gym_password@localhost:5432/gym_management
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -v